services:
  app:
    image: ghcr.io/dinu-sri/team-tasks-app:latest
    container_name: team-tasks-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - APP_URL=${APP_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - DATABASE_URL=postgresql://teamtasks:${POSTGRES_PASSWORD}@postgres:5432/teamtasks?schema=public
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - team-tasks-net

  postgres:
    image: postgres:16-alpine
    container_name: team-tasks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamtasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: teamtasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamtasks"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - team-tasks-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: team-tasks-tunnel
    profiles:
      - tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - team-tasks-net

volumes:
  pgdata:

networks:
  team-tasks-net:
    driver: bridge
