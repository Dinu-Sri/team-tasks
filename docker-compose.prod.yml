services:
  app:
    image: ghcr.io/dinu-sri/team-tasks-app:latest
    container_name: team-tasks-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - APP_URL=${APP_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - MOMENTUM_CRON_SECRET=${MOMENTUM_CRON_SECRET}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM}
      - RESEND_REPLY_TO=${RESEND_REPLY_TO}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS}
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET}
      - PAYHERE_SECRET=${PAYHERE_SECRET}
      - PAYHERE_MERCHANT_SECRET_KEY=${PAYHERE_MERCHANT_SECRET_KEY}
      - PAYHERE_MD5_SECRET=${PAYHERE_MD5_SECRET}
      - PAYHERE_MODE=${PAYHERE_MODE}
      - PAYHERE_SANDBOX=${PAYHERE_SANDBOX}
      - PAYHERE_APP_ID=${PAYHERE_APP_ID}
      - PAYHERE_APP_SECRET=${PAYHERE_APP_SECRET}
      - PAYHERE_BUSINESS_APP_ID=${PAYHERE_BUSINESS_APP_ID}
      - PAYHERE_BUSINESS_APP_SECRET=${PAYHERE_BUSINESS_APP_SECRET}
      - PAYHERE_OAUTH_APP_ID=${PAYHERE_OAUTH_APP_ID}
      - PAYHERE_OAUTH_APP_SECRET=${PAYHERE_OAUTH_APP_SECRET}
      - PAYHERE_DEFAULT_PHONE=${PAYHERE_DEFAULT_PHONE}
      - PAYHERE_DEFAULT_CITY=${PAYHERE_DEFAULT_CITY}
      - PAYHERE_DEFAULT_COUNTRY=${PAYHERE_DEFAULT_COUNTRY}
      - BILLING_CRON_SECRET=${BILLING_CRON_SECRET}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - task_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - team-tasks-net

  momentum-scheduler:
    image: ghcr.io/dinu-sri/team-tasks-app:latest
    container_name: team-tasks-momentum-scheduler
    restart: unless-stopped
    entrypoint: ["node", "momentum-scheduler.mjs"]
    environment:
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      - MOMENTUM_CRON_SECRET=${MOMENTUM_CRON_SECRET}
    depends_on:
      - app
    networks:
      - team-tasks-net

  postgres:
    image: postgres:16-alpine
    container_name: team-tasks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamtasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      POSTGRES_DB: teamtasks
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamtasks"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - team-tasks-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: team-tasks-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN_is_required}
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - team-tasks-net

volumes:
  postgres_data_v2:
    name: team-tasks-postgres-v2
  task_uploads:
    name: team-tasks-uploads

networks:
  team-tasks-net:
    driver: bridge
