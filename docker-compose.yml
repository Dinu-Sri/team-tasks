services:
  postgres:
    image: postgres:16-alpine
    container_name: team-tasks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamtasks
      POSTGRES_PASSWORD: teamtasks
      POSTGRES_DB: teamtasks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
